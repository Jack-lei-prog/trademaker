# Render Blueprint / 腾讯云手动部署配置
# Render: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: trademaker
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers=2 --timeout=120
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://your-domain.com"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://api.moonshot.cn/v1/chat/completions
      - key: LLM_MODEL
        value: kimi-k2.7-code
      - key: LLM_BACKUP1_KEY
        sync: false
      - key: LLM_BACKUP1_URL
        value: https://api.deepseek.com/v1/chat/completions
      - key: LLM_BACKUP1_MODEL
        value: deepseek-chat
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_MODEL
        value: kimi-k2.7-code
